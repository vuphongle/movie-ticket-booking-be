spring.application.name=movie-ticket-booking-be
server.port=8080

app.frontend.host=http://localhost
app.frontend.port=3000

# MariaDB for Docker
spring.datasource.url=jdbc:mariadb://mariadb:3306/db_movie_ticket_booking?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

## JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Dialect cho MariaDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# SECURITY
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=31536000000

# SendPulse REST API Configuration
# Get credentials from: https://login.sendpulse.com/oauth/applications
sendpulse.api.url=https://api.sendpulse.com
sendpulse.api.client-id=${SENDPULSE_CLIENT_ID}
sendpulse.api.client-secret=${SENDPULSE_CLIENT_SECRET}
sendpulse.mail.from.email=${SENDPULSE_MAIL_FROM_EMAIL:noreply@yourdomain.com}
sendpulse.mail.from.name=${SENDPULSE_MAIL_FROM_NAME:Go Cinema}

# AWS S3 Configuration
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=ap-southeast-1
aws.s3.bucket-name=go-cinema

# Actuator endpoints for health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAI Chatbot - Use SPRING_AI_OPENAI_API_KEY from environment
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.chat.options.max-tokens=800