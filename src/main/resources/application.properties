spring.application.name=movie-ticket-booking-be
server.port=8080


# MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/db-movie-ticket-booking?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sapassword
