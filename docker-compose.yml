version: "3.8"

services:
  # Database Service
  mariadb:
    image: mariadb:10.11
    container_name: movie-booking-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-db-movie-ticket-booking}
      MYSQL_USER: ${DB_USERNAME:-movie_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - movie-booking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-booking-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-db-movie-ticket-booking}
      DB_USERNAME: ${DB_USERNAME:-movie_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_key_change_in_production}
      MAIL_USERNAME: ${MAIL_USERNAME:-your_email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your_app_password}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - movie-booking-network
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: movie-booking-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - movie-booking-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  mariadb_data:
    driver: local
  app_logs:
    driver: local

networks:
  movie-booking-network:
    driver: bridge
